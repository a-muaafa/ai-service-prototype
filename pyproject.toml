[project]
name = "ai-service-prototype"
version = "2.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = [
    "S603",  # subprocess calls (not used)
    "S607",  # partial path (not relevant)
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

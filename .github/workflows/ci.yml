name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Train model
        run: python train_model.py

      - name: Verify model artifacts
        run: |
          test -f model.joblib && echo "✓ model.joblib exists"
          test -f model_metadata.json && echo "✓ model_metadata.json exists"
          test -f evaluation_report.txt && echo "✓ evaluation_report.txt exists"

      - name: Run tests
        run: pytest -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate model for Docker build
        run: |
          pip install -r requirements.txt
          python train_model.py

      - name: Build Docker image
        run: docker build -t ai-service-prototype .

      - name: Start container
        run: |
          docker run -d --name test-svc -p 8000:8000 ai-service-prototype
          sleep 5

      - name: Health check
        run: |
          curl -sf http://localhost:8000/api/v1/health | python -m json.tool
          echo "✓ Health check passed"

      - name: Readiness check
        run: |
          curl -sf http://localhost:8000/api/v1/ready | python -m json.tool
          echo "✓ Readiness check passed"

      - name: Prediction test
        run: |
          curl -sf -X POST http://localhost:8000/api/v1/predict \
            -H "Content-Type: application/json" \
            -d '{
              "square_footage": 1500,
              "num_bedrooms": 3,
              "num_bathrooms": 2.0,
              "age_years": 10,
              "location_tier": "suburban",
              "has_garage": true
            }' | python -m json.tool
          echo "✓ Prediction test passed"

      - name: Stop container
        if: always()
        run: docker stop test-svc || true
